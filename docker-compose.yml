services:
  icloud-mail-mcp:
    build: .
    container_name: icloud-mail-mcp
    restart: unless-stopped
    env_file: .env
    ports:
      - "3456:3456"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3456/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s


